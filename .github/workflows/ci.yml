name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests

  clean-install:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install twice, doctor, uninstall
        shell: bash
        run: |
          set -euo pipefail
          git checkout -q -B ci-install
          export HARNESS_REPO="$PWD"
          export HOME="$(mktemp -d)"
          unset CLAUDE_CONFIG_DIR
          tree_hash() {
            python -I -c 'import sys; sys.path.insert(0, "tests"); from support import tree; import hashlib, json; print(hashlib.sha256(json.dumps(tree(sys.argv[1]), sort_keys=True).encode()).hexdigest())' "$HOME"
          }
          bash install.sh
          first="$(tree_hash)"
          bash install.sh
          test "$first" = "$(tree_hash)"
          "$HOME/.local/bin/harness" doctor
          "$HOME/.local/bin/harness" uninstall
          bash install.sh
          "$HOME/.local/bin/harness" uninstall
          rm -rf "$HOME/.harness"
          test -z "$(ls -A "$HOME")"

  live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - name: The public install command
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          unset CLAUDE_CONFIG_DIR
          curl -fsSL https://raw.githubusercontent.com/B0yko/harness-skeleton/main/install.sh | bash
          "$HOME/.local/bin/harness" doctor
          "$HOME/.local/bin/harness" uninstall
          rm -rf "$HOME/.harness"
          test -z "$(ls -A "$HOME")"
